    <title>Homepage</title>

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }
        header {
            padding: 20px;

            text-decoration: none;
            font-size: 18px;
        }
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;

            height: 80vh;

            margin-bottom: 10px;

        .hero p {

    <header>
